[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-vcm"
version = "0.34.1"
description = "V34-R1 adaptive preprocessing controller before real H.264/H.265 with frozen Video Swin evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "torch>=2.0", "torchvision>=0.15", "Pillow>=9", "pycocotools>=2.0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tracking = ["supervision==0.27.0"]
figures = ["matplotlib>=3.8"]

[project.scripts]
adaptive-vcm-v34 = "adaptive_vcm.v34.runner:main"
adaptive-vcm-holdout = "adaptive_vcm.v34.holdout:main"

[tool.setuptools.packages.find]
include = ["adaptive_vcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["codec: integration with real FFmpeg x264/x265"]
