[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-vcm"
version = "0.22.0"
description = "Task guarded spatial and temporal preprocessing before H.264/H.265 for OD and AR"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8", "torch>=2.0", "torchvision>=0.15", "Pillow>=9", "pycocotools>=2.0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
kaggle = ["kaggle>=1.7"]

[project.scripts]
adaptive-vcm = "adaptive_vcm.evaluate:main"

[tool.setuptools.packages.find]
include = ["adaptive_vcm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["codec: integration with real FFmpeg x264/x265"]
